volumes:
  silo: {}

services:
  silo:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    restart: unless-stopped
    command: server --console-address ':9001' /data
    environment:
      MINIO_ROOT_USER: siloadmin
      MINIO_ROOT_PASSWORD: siloadmin
    volumes:
      - silo:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  create-silo-bucket:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      - silo
    restart: on-failure:3
    entrypoint: >
      /bin/sh -c "
      mcli alias set silo http://silo:9000 siloadmin siloadmin &&
      mcli mb --ignore-existing silo/python-index-proxy;
      "
