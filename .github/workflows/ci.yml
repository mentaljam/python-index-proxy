name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: /tmp/python-index-proxy-uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@v5.2.7
        with:
          version: "2026.11.6"

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-on-failure: true

      - name: Cache uv dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'e2e/uv.lock', 'mise-tasks/release-check') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-

      - name: Run checks and tests
        run: mise run ci

      - name: Prune uv cache
        if: always()
        run: mise run cache-prune

  image:
    name: Container build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
