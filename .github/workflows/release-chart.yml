name: Release chart

on:
  push:
    tags: ["chart-v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chart:
    name: Check and publish Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      MISE_DISABLE_TOOLS: rust,ruff,ty
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up chart tools with mise
        uses: jdx/mise-action@v5.2.7
        with:
          version: "2026.11.6"
          install_args: helm python uv

      - name: Check release versions and chart
        run: |
          mise run release-check
          mise run chart-check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check default image exists
        run: |
          image=$(mise run release-check --chart-image)
          docker buildx imagetools inspect "$image"

      - name: Package chart
        run: mise run chart-package

      - name: Log in to GHCR for Helm
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run chart-login

      - name: Push chart
        env:
          CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: mise run chart-push "${GITHUB_REF_NAME#chart-v}" "$CHART_REGISTRY"
