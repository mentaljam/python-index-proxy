path_prefix = "/"

[indices.default]
policy = "first"
sources = [
    "https://download.pytorch.org/whl/cu121/{package}/",
    "https://pypi.org/simple/{package}/",
]

[indices.torch-cu111]
sources = ["https://download.pytorch.org/whl/cu111/{package}/"]

[storage.s3]
endpoint = "http://127.0.0.1:9000"
bucket = "python-index-proxy"
region = "us-east-1"
access_key_id = "siloadmin"
secret_access_key = "siloadmin"
