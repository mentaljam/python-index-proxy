apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-index-proxy.fullname" . }}
  labels:
    {{- include "python-index-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "python-index-proxy.selectorLabels" . | nindent 4 }}
