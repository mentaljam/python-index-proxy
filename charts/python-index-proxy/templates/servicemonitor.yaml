{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "python-index-proxy.fullname" . }}
  labels:
    {{- $labels := include "python-index-proxy.labels" . | fromYaml }}
    {{- toYaml (mergeOverwrite $labels .Values.serviceMonitor.labels) | nindent 4 }}
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      {{- include "python-index-proxy.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ printf "%smetrics" (include "python-index-proxy.prefix" .) | quote }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
