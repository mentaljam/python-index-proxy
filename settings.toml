# Path-only prefix; a trailing slash is added when omitted.
# Supports nested URI paths and valid percent escapes, without dot/empty
# segments, encoded separators, control characters or routing captures.
path_prefix = "/"

# Optional external application URL for client links and connection commands.
# When omitted, defaults to http://{bind}{path_prefix}.
# Its path can differ from path_prefix when an ingress rewrites the path.
# Must be HTTP(S), without credentials, query or fragment; a trailing slash is added.
# public_url = "https://packages.example.org/proxy/"

# Index names are case-sensitive ASCII letters/digits with internal '.', '_' or '-'.
# Sources must be absolute HTTP(S) URLs with exactly one {package} in the path.
# Query strings and credentials are preserved; the path gets a trailing slash.
# /{index}/ shows connection instructions; listing all projects is not supported.
[indices]
default = [
    "https://download.pytorch.org/whl/cu121/{package}/",
    "https://pypi.org/simple/{package}/",
]
torch-cu111 = ["https://download.pytorch.org/whl/cu111/{package}/"]

[storage.s3]
endpoint = "http://127.0.0.1:9000"
bucket = "python-index-proxy"
region = "us-east-1"
access_key_id = "siloadmin"
secret_access_key = "siloadmin"

# Per-replica content budget; allocator overhead and in-flight work are separate.
[index_cache]
max_capacity = "128 MiB"
ttl = "1h"

[limits]
# Saturated new work returns 503 with Retry-After: 1; same-key requests coalesce.
# Maximum decoded body of each upstream index page.
max_index_page_size = "32 MiB"
max_index_refreshes = 4
max_artifact_downloads = 16

# Upstream HTTP only; storage operations retain their backend behavior.
[upstream]
connect_timeout = "5s"
response_header_timeout = "30s"
read_timeout = "30s"
# Per source, from request start through body completion; excludes parsing.
index_download_timeout = "60s"
