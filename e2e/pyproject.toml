[project]
name = "python-index-proxy-e2e"
version = "0.1.0"
description = "End-to-end compatibility tests using real pip and uv clients"
requires-python = ">=3.15"

dependencies = [
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto"

[tool.ruff]
extend = "../ruff.toml"
src = ["tests"]

[tool.ruff.lint]
ignore = [
    "D",       # Test names and assertions describe behavior.
    "S101",    # Assertions are the test oracle.
    "PLR2004", # Literal values clarify fixtures.
    "TC",      # Keep fixture type annotations readable.
]
