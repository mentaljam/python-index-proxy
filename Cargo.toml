[package]
name = "python-index-proxy"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = "symbols"
lto = true

[dependencies]
anyhow = "^1.0"
async-stream = "^0.3"
aws-region = { version = "^0.27", features = ["serde"] }
axum = { version = "^0.8", features = ["macros"] }
byte-unit-serde = "^0.1"
bytes = "^1.12"
config = { version = "^0.15", default-features = false, features = ["toml"] }
futures = "^0.3"
hex = "^0.4"
http = "*"
humantime-serde = "^1.1"
moka = { version = "^0.12", features = ["future"] }
# opendal = "^0.45"
quick-xml = { version = "^0.42", features = ["async-tokio"] }
redb = "^4.5"
redb_legacy = { package = "redb", version = "~2.6" }
reqwest = { version = "^0.13", features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "rustls",
], default-features = false }
rustls = { version = "^0.23", default-features = false, features = ["aws-lc-rs"] }
s3-tokio = "0.39"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha2 = "^0.11"
tokio = { version = "^1.54", features = ["full"] }
toml = "^1.2"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
url = "^2.5"
