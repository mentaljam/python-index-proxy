[package]
name = "python-index-proxy"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
anyhow = "^1.0"
async-stream = "^0.3"
axum = { version = "^0.8", default-features = false, features = [
    "tokio",
    "http1",
] }
byte-unit-serde = "^0.1"
bytes = "^1.12"
config = { version = "^0.15", default-features = false, features = ["toml"] }
futures = { version = "^0.3", default-features = false, features = [
    "std",
    "async-await",
] }
hex = "^0.4"
html5gum = { version = "0.9.1", default-features = false }
http = "1"
http-body = "1"
humantime-serde = "^1.1"
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }
moka = { version = "^0.12", features = ["future"] }
opendal = { version = "^0.59", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest",
    "services-fs",
] }
opendal-http-transport-reqwest = { version = "^0.59", default-features = false, features = [
    "rustls",
] }
opendal-layer-observe-metrics-common = { version = "0.59.5", default-features = false, optional = true }
percent-encoding = "^2.3"
reqwest = { version = "^0.13", features = [
    "deflate",
    "gzip",
    "http2",
    "rustls",
    "zstd",
], default-features = false }
rustls = { version = "^0.23", default-features = false, features = [
    "aws-lc-rs",
] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha2 = "^0.11"
tokio = { version = "^1.54", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "^0.7", features = ["rt"] }
toml-example = { version = "0.17.2", optional = true }
tower-http = { version = "^0.7", features = [
    "compression-gzip",
    "compression-zstd",
] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter", "json"] }
url = "^2.5"

[dev-dependencies]
toml = "^1.2"
tower = { version = "0.5", features = ["util"] }

[features]
default = ["config-template", "storage-s3", "storage-gcs", "storage-azblob"]
config-template = ["dep:toml-example"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:opendal-layer-observe-metrics-common", "axum/matched-path"]
storage-aliyun-drive = ["opendal/services-aliyun-drive"]
storage-alluxio = ["opendal/services-alluxio"]
storage-azblob = ["opendal/services-azblob"]
storage-azdls = ["opendal/services-azdls"]
storage-azfile = ["opendal/services-azfile"]
storage-b2 = ["opendal/services-b2"]
storage-cacache = ["opendal/services-cacache"]
storage-cloudflare-kv = ["opendal/services-cloudflare-kv"]
storage-compfs = ["opendal/services-compfs"]
storage-cos = ["opendal/services-cos"]
storage-d1 = ["opendal/services-d1"]
storage-dashmap = ["opendal/services-dashmap"]
storage-dbfs = ["opendal/services-dbfs"]
storage-dropbox = ["opendal/services-dropbox"]
storage-etcd = ["opendal/services-etcd"]
storage-foundationdb = ["opendal/services-foundationdb"]
storage-foyer = ["opendal/services-foyer"]
storage-ftp = ["opendal/services-ftp"]
storage-gcs = ["opendal/services-gcs"]
storage-gdrive = ["opendal/services-gdrive"]
storage-ghac = ["opendal/services-ghac"]
storage-github = ["opendal/services-github"]
storage-goosefs = ["opendal/services-goosefs"]
storage-gridfs = ["opendal/services-gridfs"]
storage-hdfs = ["opendal/services-hdfs"]
storage-hdfs-native = ["opendal/services-hdfs-native"]
storage-hf = ["opendal/services-hf"]
storage-http = ["opendal/services-http"]
storage-ipfs = ["opendal/services-ipfs"]
storage-ipmfs = ["opendal/services-ipmfs"]
storage-koofr = ["opendal/services-koofr"]
storage-lakefs = ["opendal/services-lakefs"]
storage-memcached = ["opendal/services-memcached"]
storage-memory = ["opendal/services-memory"]
storage-mini-moka = ["opendal/services-mini-moka"]
storage-moka = ["opendal/services-moka"]
storage-mongodb = ["opendal/services-mongodb"]
storage-monoiofs = ["opendal/services-monoiofs"]
storage-mysql = ["opendal/services-mysql"]
storage-obs = ["opendal/services-obs"]
storage-onedrive = ["opendal/services-onedrive"]
storage-opfs = ["opendal/services-opfs"]
storage-oss = ["opendal/services-oss"]
storage-pcloud = ["opendal/services-pcloud"]
storage-persy = ["opendal/services-persy"]
storage-postgresql = ["opendal/services-postgresql"]
storage-redb = ["opendal/services-redb"]
storage-redis = ["opendal/services-redis"]
storage-rocksdb = ["opendal/services-rocksdb"]
storage-s3 = ["opendal/services-s3"]
storage-seafile = ["opendal/services-seafile"]
storage-sftp = ["opendal/services-sftp"]
storage-sled = ["opendal/services-sled"]
storage-sqlite = ["opendal/services-sqlite"]
storage-surrealdb = ["opendal/services-surrealdb"]
storage-swift = ["opendal/services-swift"]
storage-tikv = ["opendal/services-tikv"]
storage-tos = ["opendal/services-tos"]
storage-upyun = ["opendal/services-upyun"]
storage-vercel-artifacts = ["opendal/services-vercel-artifacts"]
storage-vercel-blob = ["opendal/services-vercel-blob"]
storage-webdav = ["opendal/services-webdav"]
storage-webhdfs = ["opendal/services-webhdfs"]
storage-yandex-disk = ["opendal/services-yandex-disk"]
